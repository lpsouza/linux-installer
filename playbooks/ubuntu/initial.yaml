---
#
# This playbook installs and configures the initial setup for any Ubuntu machine.
#
- name: Install and configure initial setup
  hosts: linux
  gather_facts: yes
  become: yes

  vars:
    essential_packages:
      - p7zip-full
      - apt-transport-https
      - apt-utils
      - asciinema
      - build-essential
      - ca-certificates
      - cloud-image-utils
      - cloud-utils
      - coreutils
      - csvkit
      - curl
      - ffmpeg
      - fontconfig
      - git
      - git-crypt
      - gnupg
      - htop
      - iotop
      - iputils-ping
      - jq
      - lolcat
      - lsb-release
      - mc
      - mtr
      - ncdu
      - net-tools
      - neovim
      - pandoc
      - python3
      - python3-venv
      - rsync
      - socat
      - software-properties-common
      - stow
      - tesseract-ocr
      - tmux
      - unrar
      - unzip
      - waypipe
      - wget
      - whois
      - xsltproc
      - yt-dlp
      - zip

    optional_packages:
      - rar

  tasks:
    - name: Check if tailscale is installed
      command: dpkg -s tailscale
      register: tailscale_package_status
      ignore_errors: true
      changed_when: false
      check_mode: false

    - name: Ensure software-properties-common is installed
      apt:
        name: software-properties-common
        state: present
        update_cache: yes

    - name: Check if multiverse repository is enabled
      shell: grep -rq "multiverse" /etc/apt/sources.list /etc/apt/sources.list.d/
      register: multiverse_check
      ignore_errors: true
      changed_when: false
      check_mode: false

    - name: Enable multiverse repository
      command: add-apt-repository -y multiverse
      when: multiverse_check.rc != 0

    - name: Update apt cache
      apt:
        update_cache: yes
      changed_when: false

    - name: Get Tailscale installed and candidate versions
      shell: apt-cache policy tailscale
      register: tailscale_policy
      changed_when: false
      check_mode: false
      when:
        - tailscale_package_status.rc is defined
        - tailscale_package_status.rc == 0

    - name: Set Tailscale version facts
      set_fact:
        tailscale_installed: "{{ tailscale_policy.stdout | regex_search('Installed: (.*)', '\\1') | first }}"
        tailscale_candidate: "{{ tailscale_policy.stdout | regex_search('Candidate: (.*)', '\\1') | first }}"
      when:
        - tailscale_package_status.rc is defined
        - tailscale_package_status.rc == 0
        - tailscale_policy.stdout is defined

    - name: Asynchronously update Tailscale to prevent SSH connection drop
      apt:
        name: tailscale
        state: latest
      async: 120
      poll: 0
      register: tailscale_update
      when:
        - tailscale_package_status.rc == 0
        - tailscale_installed != tailscale_candidate

    - name: Wait for Tailscale to restart and reconnect SSH
      wait_for_connection:
        delay: 15
        timeout: 120
      when:
        - tailscale_update is defined
        - tailscale_update.ansible_job_id is defined

    - name: Wait for Tailscale update to complete
      async_status:
        jid: "{{ tailscale_update.ansible_job_id }}"
      register: tailscale_job_result
      until: tailscale_job_result.finished
      retries: 30
      delay: 5
      when:
        - tailscale_update is defined
        - tailscale_update.ansible_job_id is defined

    - name: Update and upgrade apt packages
      apt:
        upgrade: yes
      register: apt_result
      until: apt_result is success
      retries: 10
      delay: 10

    - name: Install essential packages
      apt:
        name: "{{ essential_packages }}"
        state: present

    - name: Install optional or architecture-dependent packages
      apt:
        name: "{{ item }}"
        state: present
      loop: "{{ optional_packages }}"
      ignore_errors: true

    - name: Set Neovim as default editor
      alternatives:
        name: editor
        path: /usr/bin/nvim

    - name: Configure hushlogin
      copy:
        content: ""
        dest: "~/.hushlogin"
        mode: '0644'
      become: no
