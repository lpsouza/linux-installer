---
#
# This playbook install and customize a CLI environment for my needs.
#
- name: Install and configure CLI environment
  hosts: linux
  gather_facts: yes
  become: yes

  tasks:
    - name: Install Github CLI
      block:
        - name: Install GitHub CLI
          apt:
            name: gh
            state: present
            update_cache: yes
      tags: github_cli

    - name: Install GitHub Copilot CLI
      block:
        - name: Check if GitHub Copilot CLI is already installed
          stat:
            path: "~/.local/bin/copilot"
          register: copilot_cli_installed
          become: no

        - name: Install GitHub Copilot CLI
          shell: |
            curl -fsSL https://gh.io/copilot-install | bash
          args:
            executable: /bin/bash
          when: not copilot_cli_installed.stat.exists
          become: no
      tags: copilot_cli

    - name: Install Node Version Manager (NVM)
      block:
        - name: Download and install NVM
          shell: |
            curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/v0.39.3/install.sh | bash
          args:
            creates: "~/.nvm/nvm.sh"
          become: no

        - name: Load NVM and install latest Node.js LTS
          shell: |
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            nvm install --lts
          args:
            executable: /bin/bash
          become: no
      tags: nvm, opencode_cli, devcontainer_cli

    - name: Install Kiro CLI
      block:
        - name: Check if Kiro CLI is already installed
          stat:
            path: "~/.local/bin/kiro-cli"
          register: kiro_cli_installed
          become: no

        - name: Install Kiro CLI
          shell: |
            curl -fsSL https://cli.kiro.dev/install | bash
          args:
            executable: /bin/bash
          when: not kiro_cli_installed.stat.exists
          become: no
      tags: kiro_cli

    - name: Install OpenCode CLI
      block:
        - name: Check if OpenCode CLI is already installed
          shell: |
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            npm list -g opencode-ai
          args:
            executable: /bin/bash
          register: opencode_cli_check
          failed_when: false
          changed_when: false
          become: no

        - name: Install OpenCode CLI
          shell: |
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            npm install -g opencode-ai@latest
          args:
            executable: /bin/bash
          when: opencode_cli_check.rc != 0
          become: no
      tags: opencode_cli

    - name: Install uv (Python package installer)
      block:
        - name: Install required system packages for uv
          apt:
            name:
              - curl
              - python3-pip
              - python3-venv
            state: present
            update_cache: yes

        - name: Download uv installer script
          get_url:
            url: https://astral.sh/uv/install.sh
            dest: /tmp/uv-install.sh
            mode: '0755'
          become: no

        - name: Install uv
          shell: |
            /tmp/uv-install.sh
          args:
            creates: "~/.local/bin/uv"
            executable: /bin/bash
          become: no
      tags: uv, speckit

    - name: Install GitHub Spec-Kit
      block:
        - name: Install specify-cli using uv tool
          shell: |
            export PATH="$HOME/.local/bin:$PATH"
            uv tool install specify-cli --from git+https://github.com/github/spec-kit.git
          args:
            executable: /bin/bash
            creates: "~/.local/bin/specify"
          become: no
      tags: speckit

    - name: Install Dev Container CLI
      block:
        - name: Check if Dev Container CLI is already installed
          shell: |
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            npm list -g @devcontainers/cli
          args:
            executable: /bin/bash
          register: devcontainer_cli_check
          failed_when: false
          changed_when: false
          become: no

        - name: Install Dev Container CLI
          shell: |
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            npm install -g @devcontainers/cli
          args:
            executable: /bin/bash
          when: devcontainer_cli_check.rc != 0
          become: no
      tags: devcontainer_cli

    - name: Install 1password CLI
      block:
        - name: Check if 1Password CLI is already installed
          stat:
            path: "/usr/bin/op"
          register: onepassword_cli_installed
          become: no

        - name: Download 1Password key
          get_url:
            url: https://downloads.1password.com/linux/keys/1password.asc
            dest: /tmp/1password.asc
            mode: '0755'
          when: not onepassword_cli_installed.stat.exists

        - name: Add 1Password keyring
          command: gpg --batch --yes --dearmor --output /usr/share/keyrings/1password-archive-keyring.gpg /tmp/1password.asc
          changed_when: false
          when: not onepassword_cli_installed.stat.exists

        - name: Get dpkg architecture
          command: "dpkg --print-architecture"
          register: dpkg_arch
          changed_when: false
          failed_when: false
          when: not onepassword_cli_installed.stat.exists

        - name: Add 1Password repository
          apt_repository:
            repo: "deb [arch={{ dpkg_arch.stdout }} signed-by=/usr/share/keyrings/1password-archive-keyring.gpg] https://downloads.1password.com/linux/debian/{{ dpkg_arch.stdout }} stable main"
            state: present
            filename: 1password
          when: not onepassword_cli_installed.stat.exists

        - name: Install 1Password CLI
          apt:
            name: 1password-cli
            state: present
            update_cache: true
          when: not onepassword_cli_installed.stat.exists
      tags: onepassword_cli

    - name: Install Antigravity CLI
      block:
        - name: Check if Antigravity CLI is already installed
          stat:
            path: "~/.local/bin/agy"
          register: antigravity_cli_installed
          become: no

        - name: Install Antigravity CLI
          shell: |
            curl -fsSL https://antigravity.google/cli/install.sh | bash
          args:
            executable: /bin/bash
          when: not antigravity_cli_installed.stat.exists
          become: no
      tags: antigravity_cli

    - name: Configure Antigravity Remote Control Daemon
      block:
        - name: Check if Antigravity Remote Control service is already configured
          stat:
            path: "~/.config/systemd/user/agy-remote-control.service"
          register: antigravity_daemon_installed
          become: no

        - name: Enable linger for user
          command: "loginctl enable-linger {{ ansible_user | default(ansible_user_id) }}"
          changed_when: false
          become: yes

        - name: Install and configure Antigravity Remote Control Daemon
          shell: |
            curl -fsSL https://antigravity.google/cli/agy-daemon.sh | bash -s -- install --no-prompt
          environment:
            XDG_RUNTIME_DIR: "/run/user/{{ ansible_user_uid | default('1000') }}"
          args:
            executable: /bin/bash
          when: not antigravity_daemon_installed.stat.exists
          become: no
      tags: antigravity_remote

    - name: Install Go
      block:
        - name: Check installed Go version
          command: /usr/local/go/bin/go version
          register: go_installed_version
          failed_when: false
          changed_when: false

        - name: Download Go archive
          get_url:
            url: "https://go.dev/dl/go{{ go_version }}.linux-amd64.tar.gz"
            dest: "/tmp/go{{ go_version }}.linux-amd64.tar.gz"
            mode: '0644'
          when: go_installed_version.rc != 0 or ('go' ~ go_version ~ ' ') not in go_installed_version.stdout

        - name: Remove previous Go installation before upgrade
          file:
            path: /usr/local/go
            state: absent
          when: go_installed_version.rc == 0 and ('go' ~ go_version ~ ' ') not in go_installed_version.stdout

        - name: Extract Go archive
          unarchive:
            src: "/tmp/go{{ go_version }}.linux-amd64.tar.gz"
            dest: /usr/local
            remote_src: yes
          when: go_installed_version.rc != 0 or ('go' ~ go_version ~ ' ') not in go_installed_version.stdout

        - name: Add Go to system PATH
          copy:
            dest: /etc/profile.d/go.sh
            content: "export PATH=$PATH:/usr/local/go/bin"
            mode: '0644'

        - name: Clean up Go archive
          file:
            path: "/tmp/go{{ go_version }}.linux-amd64.tar.gz"
            state: absent
          when: go_installed_version.rc != 0 or ('go' ~ go_version ~ ' ') not in go_installed_version.stdout
      vars:
        go_version: "1.24.0"
      tags: go

    - name: Install K9s
      block:
        - name: Check if K9s is already installed
          stat:
            path: "/usr/bin/k9s"
          register: k9s_installed
          become: no

        - name: Get dpkg architecture
          command: "dpkg --print-architecture"
          register: dpkg_arch
          changed_when: false
          failed_when: false
          when: not k9s_installed.stat.exists

        - name: Download K9s deb package
          get_url:
            url: "https://github.com/derailed/k9s/releases/latest/download/k9s_linux_{{ dpkg_arch.stdout }}.deb"
            dest: "/tmp/k9s_linux_{{ dpkg_arch.stdout }}.deb"
            mode: '0644'
          when: not k9s_installed.stat.exists

        - name: Install K9s package
          apt:
            deb: "/tmp/k9s_linux_{{ dpkg_arch.stdout }}.deb"
            state: present
          when: not k9s_installed.stat.exists

        - name: Clean up K9s deb package
          file:
            path: "/tmp/k9s_linux_{{ dpkg_arch.stdout }}.deb"
            state: absent
          when: not k9s_installed.stat.exists
      tags: k9s

    - name: Install Glow
      block:
        - name: Check if Glow is already installed
          stat:
            path: "/usr/bin/glow"
          register: glow_installed
          become: no

        - name: Ensure /etc/apt/keyrings directory exists
          file:
            path: /etc/apt/keyrings
            state: directory
            mode: '0755'
          when: not glow_installed.stat.exists

        - name: Download Charm GPG key
          get_url:
            url: https://repo.charm.sh/apt/gpg.key
            dest: /tmp/charm.gpg.key
            mode: '0644'
          when: not glow_installed.stat.exists

        - name: Dearmor Charm GPG key
          command: gpg --batch --yes --dearmor --output /etc/apt/keyrings/charm.gpg /tmp/charm.gpg.key
          when: not glow_installed.stat.exists

        - name: Clean up temporary Charm GPG key
          file:
            path: /tmp/charm.gpg.key
            state: absent
          when: not glow_installed.stat.exists

        - name: Add Charm repository
          apt_repository:
            repo: "deb [signed-by=/etc/apt/keyrings/charm.gpg] https://repo.charm.sh/apt/ * *"
            state: present
            filename: charm
            update_cache: true
          when: not glow_installed.stat.exists

        - name: Install Glow package
          apt:
            name: glow
            state: present
          when: not glow_installed.stat.exists
      tags: glow
