---
#
# Playbook to install DevOps tools on Ubuntu systems
#
- name: Install DevOps Tools
  hosts: linux
  gather_facts: yes
  become: yes

  vars:
    terraform_version: "1.7.3"
    arch_suffix: "{{ 'arm64' if ansible_architecture == 'aarch64' else 'amd64' }}"
    arch_aws: "{{ 'aarch64' if ansible_architecture == 'aarch64' else 'x86_64' }}"

  tasks:
    - name: Install Terraform
      block:
        - name: Check installed Terraform version
          command: /usr/local/bin/terraform version
          register: terraform_installed_version
          failed_when: false
          changed_when: false

        - name: Download Terraform
          get_url:
            url: "https://releases.hashicorp.com/terraform/{{ terraform_version }}/terraform_{{ terraform_version }}_linux_{{ arch_suffix }}.zip"
            dest: "/tmp/terraform_installer.zip"
            mode: '0644'
            timeout: 60
          when: terraform_installed_version.rc != 0 or ('v' ~ terraform_version) not in terraform_installed_version.stdout

        - name: Unzip Terraform
          unarchive:
            src: "/tmp/terraform_installer.zip"
            dest: "/usr/local/bin"
            remote_src: yes
            mode: '0755'
          when: terraform_installed_version.rc != 0 or ('v' ~ terraform_version) not in terraform_installed_version.stdout

        - name: Clean up Terraform installer archive
          file:
            path: "/tmp/terraform_installer.zip"
            state: absent
          when: terraform_installed_version.rc != 0 or ('v' ~ terraform_version) not in terraform_installed_version.stdout
      tags: terraform

    - name: Install AWS CLI
      block:
        - name: Download AWS CLI
          get_url:
            url: "https://awscli.amazonaws.com/awscli-exe-linux-{{ arch_aws }}.zip"
            dest: "/tmp/awscliv2.zip"
            mode: '0644'
            timeout: 60

        - name: Unzip AWS CLI
          unarchive:
            src: "/tmp/awscliv2.zip"
            dest: "/tmp"
            remote_src: yes
            mode: '0755'
            creates: "/tmp/aws"

        - name: Install AWS CLI
          command: "/tmp/aws/install --update"
      tags: aws_cli

    - name: Install Azure CLI
      block:
        - name: Download Azure CLI installation script
          get_url:
            url: "https://aka.ms/InstallAzureCLIDeb"
            dest: "/tmp/install_az_cli.sh"
            mode: '0755'
            timeout: 60

        - name: Run Azure CLI installation script
          shell: "/tmp/install_az_cli.sh"
          args:
            creates: "/usr/bin/az"
      tags: azure_cli

    - name: Install Google Cloud CLI
      block:
        - name: Ensure /etc/apt/keyrings directory exists
          file:
            path: /etc/apt/keyrings
            state: directory
            mode: '0755'

        - name: Download Google Cloud CLI GPG key
          get_url:
            url: "https://packages.cloud.google.com/apt/doc/apt-key.gpg"
            dest: "/tmp/gcloud.gpg"
            mode: '0644'

        - name: Dearmor Google Cloud CLI GPG key
          command: gpg --batch --yes --dearmor --output /etc/apt/keyrings/google-cloud.gpg /tmp/gcloud.gpg
          changed_when: false

        - name: Clean up temporary Google Cloud GPG key
          file:
            path: /tmp/gcloud.gpg
            state: absent

        - name: Add Google Cloud CLI repository
          apt_repository:
            repo: "deb [signed-by=/etc/apt/keyrings/google-cloud.gpg] https://packages.cloud.google.com/apt cloud-sdk main"
            filename: google-cloud-sdk
            state: present
            update_cache: true

        - name: Install Google Cloud CLI
          apt:
            name: google-cloud-cli
            state: present
            update_cache: true
      tags: gcloud_cli

    - name: Install eksctl
      block:
        - name: Check if eksctl is already installed
          stat:
            path: "/usr/local/bin/eksctl"
          register: eksctl_installed
          become: no

        - name: Download eksctl
          get_url:
            url: "https://github.com/eksctl-io/eksctl/releases/latest/download/eksctl_Linux_{{ arch_suffix }}.tar.gz"
            dest: "/tmp/eksctl_Linux_{{ arch_suffix }}.tar.gz"
            mode: '0644'
            timeout: 60
          when: not eksctl_installed.stat.exists

        - name: Extract eksctl
          unarchive:
            src: "/tmp/eksctl_Linux_{{ arch_suffix }}.tar.gz"
            dest: "/usr/local/bin"
            remote_src: yes
            mode: '0755'
          when: not eksctl_installed.stat.exists

        - name: Clean up eksctl archive
          file:
            path: "/tmp/eksctl_Linux_{{ arch_suffix }}.tar.gz"
            state: absent
          when: not eksctl_installed.stat.exists
      tags: eksctl

